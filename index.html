<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRMS Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --primary:#6366F1;
  --secondary:#8B5CF6;
  --bg:#F5F3FF;
  --glass:rgba(255,255,255,0.7);
  --text:#1E1B4B;
}

body.dark{
  --bg:#0F0F1A;
  --glass:rgba(30,27,75,0.6);
  --text:#F3F4F6;
  --primary:#7C3AED;
  --secondary:#A78BFA;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  display:flex;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

/* Sidebar */
.sidebar{
  width:250px;
  background:linear-gradient(180deg,var(--primary),var(--secondary));
  color:white;
  height:100vh;
  position:fixed;
  transition:0.4s;
  overflow:hidden;
}

.sidebar.collapsed{
  width:80px;
}

.sidebar h2{
  padding:20px;
  text-align:center;
}

.sidebar a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:15px 20px;
  color:white;
  text-decoration:none;
  transition:0.3s;
}

.sidebar a:hover{
  background:rgba(255,255,255,0.2);
}

.sidebar.collapsed a span{
  display:none;
}

/* Main */
.main{
  margin-left:250px;
  padding:40px;
  width:100%;
  transition:0.4s;
}

.sidebar.collapsed ~ .main{
  margin-left:80px;
}

/* Topbar */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.toggle-btn{
  background:var(--primary);
  border:none;
  color:white;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:0.3s;
}

.toggle-btn:hover{
  opacity:0.9;
}

/* Glass Cards */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:var(--glass);
  backdrop-filter:blur(15px);
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,0.1);
  transition:0.4s;
  animation:fadeIn 0.8s ease-in-out;
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
}

.card h3{
  margin-bottom:10px;
  font-weight:600;
}

.card h2{
  font-size:28px;
  color:var(--primary);
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

/* Responsive */
@media(max-width:768px){
  .sidebar{
    position:absolute;
    z-index:1000;
  }
  .main{
    margin-left:0;
  }
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">
  <h2>MRMS</h2>
  <a href="admindashboard.html"><i class="fas fa-home"></i> <span>Dashboard</span></a>
  <a href="managedoctors.html"><i class="fas fa-user-md"></i> <span>Doctors</span></a>
  <a href="managemrs.html"><i class="fas fa-user"></i> <span>MRs</span></a>
  <a href="reports.html"><i class="fas fa-chart-line"></i> <span>Reports</span></a>
  <a href="logout.html"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
</div>

<div class="main">

  <div class="topbar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    <button class="toggle-btn" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="cards">
    <div class="card">
      <h3>Total Doctors</h3>
    </div>

    <div class="card">
      <h3>Total MRs</h3>
    </div>

    <div class="card">
      <h3>Pending Approvals</h3>
    </div>

    <div class="card">
      <h3>Total Reports</h3>
    </div>
  </div>

</div>

<script>
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("collapsed");
}

function toggleTheme(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
